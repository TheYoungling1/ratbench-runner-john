# SWE-agent config for the `sweagent_repo2run` variety — a port of the Repo2Run paper's
# SWE-agent baseline settings (arXiv:2502.13681, appendix I.2) onto the SWE-agent version this
# repo actually installs.
#
# WHY A PORT AND NOT A COPY: the paper's `tools.bundles` list is from the 0.7/1.0-era tool tree and
# three of its six entries no longer exist upstream (checked against SWE-agent main):
#
#   paper bundle          | today                          | substitution made here
#   ----------------------|--------------------------------|----------------------------------
#   tools/registry        | tools/registry                 | kept
#   tools/defaults        | REMOVED upstream               | `enable_bash_tool: true`
#   tools/search          | tools/search                   | kept
#   tools/edit_linting    | tools/windowed_edit_linting    | renamed; needs tools/windowed too,
#                         |                                | which is also what consumes the
#                         |                                | paper's WINDOW/OVERLAP variables
#   tools/submit          | tools/submit                   | kept
#   tools/env_setup       | REMOVED upstream               | dropped (bash covers it)
#
# Loading the paper's list verbatim fails config validation. Everything else ports unchanged:
# `parse_function: thought_action` and `history_processors: last_n_observations` both still exist
# upstream, and the paper's prompts are reproduced verbatim below apart from `{{task_details}}` ->
# `{{problem_statement}}` (the variable SWE-agent actually binds).
#
# Runtime overrides applied by producers/sweagent_repo2run_runner.py:
#   agent.model.name / per_instance_cost_limit / per_instance_call_limit
#   env.repo.path / env.repo.base_commit          (dataset commit pin)
#   env.deployment.image                          ($SWEAGENT_DEPLOY_IMAGE)
#   output_dir
agent:
  model:
    # name / limits are set at runtime; a placeholder here keeps the file loadable standalone.
    name: deepseek/deepseek-v4-flash
    per_instance_cost_limit: 2.0
    # The paper ran every baseline at temperature 0.2 (§4: "we select gpt-4o-2024-05-13 for all
    # experiments, with the temperature uniformly set to 0.2"). SWE-agent's own default is 0.0,
    # so leaving this unset would silently diverge. Override with $SWEAGENT_TEMPERATURE.
    temperature: 0.2
    completion_kwargs:
      extra_body:
        # Thinking mode OFF. DeepSeek v4 enables it by default, but the paper's baselines all ran
        # on gpt-4o-2024-05-13, a non-reasoning model — leaving it on makes this a materially
        # stronger agent than the one that scored 26.9% DGSR, which defeats the comparison this
        # arm exists for. It is also redundant: `thought_action` already requires an explicit
        # DISCUSSION block every turn, so reasoning duplicates a scaffold the parser demands.
        # And it is expensive and invisible: reasoning was ~92% of output tokens on the smoke run,
        # output is the dearer side ($0.66/1M vs $0.22/1M input-miss), and `reasoning_content`
        # never reaches the trajectory — you are billed for text you cannot inspect.
        # Verified against the live API (2026-09-03), same prompt:
        #   default                        completion=13, reasoning=11
        #   thinking {type: disabled}      completion=1,  reasoning=none
        #   reasoning_effort: low          completion=62, reasoning=60   <- worse, not a midpoint
        # Override with $SWEAGENT_THINKING = enabled | disabled.
        thinking:
          type: disabled
  templates:
    system_template: |-
      SETTING: You are an expert skilled in environment configuration, operating directly in the
      command line with a specialized interface.

      The specialized interface consists of {{WINDOW}} lines of context at a time. In addition to
      typical bash commands, you can also use the following commands to help you with environment
      setup.

      COMMANDS:
      {{command_docs}}

      Please note that THE EDIT COMMAND REQUIRES PROPER INDENTATION. Ensure correct indentation
      when modifying code.

      RESPONSE FORMAT:
      Your shell prompt is formatted as follows:
      (Current task: <task name>) <cwd> $

      You need to format your output using two fields: discussion and command.
      Example:
      DISCUSSION
      I'll start by using ls to see the files in the root directory.
      ```
      ls /repo
      ```

      You should only include a SINGLE command in the command section and then wait for a
      response. Everything in the DISCUSSION section will be saved for future reference.
      You can use any other bash commands and the special commands listed above, but interactive
      session commands (e.g., python, vim) are not supported.
    instance_template: |-
      We're currently setting up the environment for the following task. Here are the details:

      TASK:
      {{problem_statement}}

      INSTRUCTIONS:
      Now, you'll carry out this task on your own. Your terminal session has begun in the
      repository's root directory. Use the provided commands and any bash commands you need. Edit
      and check files as needed.

      The goal is to generate a Dockerfile that can successfully build and run the tests in the
      repository using the command "pytest --collect-only -q".

      NOTE:
      1. The repository is cloned into /repo.
      2. The Dockerfile should start with the following lines (if the base image is python:3.10
         and repository is adamobeng/wddbfs):
      ```
      FROM python:3.10
      RUN pip install pytest
      RUN git clone https://github.com/adamobeng/wddbfs.git
      RUN mkdir /repo
      RUN git config --global --add safe.directory /repo
      RUN cp -r /wddbfs/. /repo && rm -rf /wddbfs/
      RUN rm -rf /wddbfs
      ```

      Your task includes:
      0. **Generate Dockerfile**: Create a file named "Dockerfile" in the root path (e.g, the
         absolute path is /Dockerfile).
      1. **Read Directory Structure**: Check the folder structure in the root directory.
      2. **Check the Configuration Files**: Inspect files like "requirements.txt", "setup.py",
         "setup.cfg", "Pipfile*", etc.
      3. **Determine Package Dependencies**: Handle dependencies and manage conflicting dependency
         versions.
      4. **Testing**: Ensure "pytest /repo --collect-only -q" runs without errors.
      5. **Generate Dockerfile**: Write necessary installation or setup steps determined from the
         inspection. If you finish run testing successfully, you should modify the Dockerfile in
         /Dockerfile.

      IMPORTANT TIPS:
      * Check the directory and files carefully.
      * Make sure Dockerfile commands are correct.
      * Use proper Dockerfile syntax and indentation.
      * Test the final Dockerfile by running "pytest /repo --collect-only -q".

      (Current task: Generate Dockerfile)
      (Current directory: {{working_dir}})
      bash-$
    problem_statement_template: |-
      Set up the environment for the {{language}} repository {{full_name}} ({{repo_url}}) so that
      its test suite can be collected and run, and record the working setup as a Dockerfile at
      /Dockerfile.
    next_step_template: |-
      {{observation}}
      (Current task: Generate Dockerfile)
      (Current directory: {{working_dir}})
      bash-$
    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
      (Current task: Generate Dockerfile)
      (Current directory: {{working_dir}})
      bash-$
  tools:
    # NOT in the paper and NOT in config/default.yaml, which inherits SWE-agent's own defaults of
    # 30 s per command / 1800 s total (sweagent/tools/tools.py:139,145) plus
    # max_consecutive_execution_timeouts=3. On an ENVIRONMENT-CONSTRUCTION benchmark the workload
    # is `pip install` of scientific stacks and `apt-get update`, which routinely exceed 30 s, so
    # three consecutive timeouts would end the run and the default would make this arm partly a
    # measurement of the clock rather than of the scaffold. These are the same ceilings set in
    # producers/sweagent_repo2run_modern_config.yaml, so the baseline-vs-modern contrast isolates
    # the SCAFFOLD rather than the timeout budget. A deliberate deviation from SWE-agent's own
    # defaults, applied identically to both arms.
    execution_timeout: 600
    total_execution_timeout: 7200
    env_variables:
      WINDOW: 100
      OVERLAP: 2
      # Not in the paper: keeps pagers/progress bars from flooding the 100-line window, exactly as
      # the in-place lane's config does. Cosmetic only — no effect on what the agent can do.
      PAGER: cat
      MANPAGER: cat
      GIT_PAGER: cat
      LESS: -R
      PIP_PROGRESS_BAR: 'off'
      TQDM_DISABLE: '1'
    bundles:
      - path: tools/registry
      - path: tools/windowed              # paper's WINDOW/OVERLAP consumer
      - path: tools/search
      - path: tools/windowed_edit_linting # paper: tools/edit_linting
      - path: tools/submit
    enable_bash_tool: true                # paper: tools/defaults
    parse_function:
      type: thought_action
  history_processors:
    - type: last_n_observations
      n: 5
env:
  deployment:
    type: docker
    # python:3.10 (not -slim) because the deployment container needs git; overridden at runtime
    # from $SWEAGENT_DEPLOY_IMAGE.
    image: python:3.10
    remove_container: false
    remove_images: false
  repo:
    type: local
    path: ./my-repo
