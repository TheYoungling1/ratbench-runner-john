agent:
  model:
    name: deepseek/deepseek-chat
    per_instance_call_limit: 15
  templates:
    system_template: |-
      You are an expert DevOps engineer specialized in repository environment setup and configuration.
      Your role is to analyze project dependencies, install packages, and ensure the repository is ready to run tests.
      You should focus on environment setup and avoid modifying application code unless absolutely necessary for configuration purposes.
    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I have uploaded a Node.js repository in {{working_dir}}.

      <setup_requirements>
      {{problem_statement}}
      </setup_requirements>

      Your task is to configure this repository so it can run and pass all tests.

      ## Workflow
      1. **Explore Repository**: Understand the project structure, identify key files and entry points
      2. **Analyze Dependencies**: Locate and examine dependency files (package.json, package-lock.json, yarn.lock, etc.)
      3. **Install Dependencies**: Use npm, yarn, or pnpm to install all required packages
      4. **Verify Installation**: Check that critical packages are available in node_modules
      5. **Fix Environment Issues**: If you encounter module resolution errors, install missing packages
      6. **Validate Setup**: Ensure the environment is ready to run tests (but do not run the full test suite yourself)

      ## Code Modification Policy
      AVOID modifying code whenever possible. Only make changes if absolutely necessary for environment setup:
      - Create missing configuration files (e.g., .npmrc, .yarnrc, tsconfig.json)
      - Fix critical module resolution issues that prevent basic functionality
      -  Make minimal adjustments only when no other solution exists

      NEVER modify:
      - Test files or test logic
      - Core application behavior or business logic
      - Code to make failing tests pass (fix environment issues only)

      ## Important Notes
      - Focus on installing dependencies and configuring the package manager
      - Prioritize fixing MODULE_NOT_FOUND and dependency resolution errors
      - Make minimal, conservative changes when code modification is unavoidable
      - Document your reasoning for any code changes you make

      Be thorough in your analysis and reasoning.
    problem_statement_template: |-
      This is a {{language}} repository that requires environment setup and configuration.

      ## Objective
      Configure the repository to be ready for running tests successfully.

      ## Detailed Steps

      ### 1. Repository Analysis
      - Explore the project structure and identify main components
      - Locate documentation files (README.md, CONTRIBUTING.md, docs/)
      - Identify the package manager (npm, yarn, pnpm, etc.)
      - Find dependency files (package.json, package-lock.json, yarn.lock, pnpm-lock.yaml)
      - Understand the recommended installation method from documentation

      ### 2. Dependency Installation
      - Read package.json to understand project dependencies
      - Install dependencies using the appropriate package manager:
        - npm: `npm install` or `npm ci`
        - yarn: `yarn install`
        - pnpm: `pnpm install`
      - Handle both dependencies and devDependencies
      - Resolve any peer dependency warnings or conflicts
      - Install test framework dependencies (Jest, Mocha, etc.)

      ### 3. Environment Configuration
      - Set any required environment variables (NODE_ENV, etc.)
      - Create necessary configuration files if missing (.env, config files)
      - Configure package manager settings (.npmrc, .yarnrc)
      - Set up proper directory structures if needed

      ### 4. Installation Verification
      - Verify that packages are installed in node_modules
      - Check that main entry points can be resolved
      - Ensure test framework can be invoked

      ### 5. Troubleshooting
      - If you encounter MODULE_NOT_FOUND: install the missing package
      - If you encounter peer dependency issues: install required peer dependencies
      - If configuration files are missing: create them based on documentation or examples
      - If there are version conflicts: try using npm/yarn resolutions

      ## Success Criteria
      The repository is considered properly configured when:
      - All dependencies are installed successfully
      - node_modules is populated with required packages
      - Package manager operations complete without errors
      - Test framework can be invoked (even if some tests fail due to bugs)

      ## Constraints
      - Do NOT run the full test suite yourself - only verify that the environment is ready
      - Do NOT modify test files or test logic
      - Do NOT change application code to make tests pass
      - Focus exclusively on environment setup and dependency installation
    next_step_template: |-
      Observation:
      {{observation}}
    next_step_no_output_template: |-
      Your command ran successfully, but produced no output.
  tools:
    env_variables:
      PAGER: cat
      MANPAGER: cat
      LESS: -R
      GIT_PAGER: cat
      NPM_CONFIG_LOGLEVEL: error
      NPM_CONFIG_PROGRESS: 'false'
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
    registry_variables:
      USE_FILEMAP: 'true'
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for setting up this repository environment.

          Before submitting, please verify your configuration is complete and appropriate.

          ## Pre-Submission Checklist

          - **Dependencies Installed**: All required packages are installed in node_modules
          - **Environment Ready**: Configuration files are in place, environment variables set (if needed)
          - **No Module Errors**: Critical modules can be required/imported without MODULE_NOT_FOUND
          - **Minimal Changes**: Only necessary modifications were made (ideally none)

          ## Review Your Changes

          Below is a summary of all your changes. Please ensure they follow the guidelines:

          ### Acceptable Changes (if necessary):
          - Lock files updated (package-lock.json, yarn.lock, pnpm-lock.yaml)
          - New configuration files (.npmrc, .env, tsconfig.json, etc.)
          - Fixed module resolution issues (only if absolutely required)

          ### Unacceptable Changes (must be reverted):
          - Modifications to test files (*.test.js, *.spec.js, __tests__/ directory)
          - Changes to core application logic
          - Code modifications made to force tests to pass

          <diff>
          {{diff}}
          </diff>

          ## Action Required
          - If you see test file modifications, revert them: `git checkout -- <test_file_path>`
          - If you see unnecessary code changes, revert them: `git checkout -- <file_path>`
          - If all changes are environment-related and minimal, run the submit command again to confirm
    enable_bash_tool: true
    parse_function:
      type: function_calling
  history_processors:
    - type: cache_control
      last_n_messages: 2
env:
  deployment:
    type: docker
    image: node:18-slim
    remove_container: false  # Do not auto-remove container
    remove_images: false     # Do not remove images (optional)
  repo:
    type: local
    path: ./my-repo
